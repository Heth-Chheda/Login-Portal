name: Deploy LoginPortal

on:
  push:
    tags:
      - "v*-dev-deploy"
      - "v*-qa-deploy"
      - "v*-stage-deploy"
      - "v*-prod-deploy"
  workflow_dispatch:
    inputs:
      deploy_version:
        type: string
        description: Version to deploy in format vX.Y.Z
      deploy_environment:
        type: choice
        description: Deploy Environment
        options:
          - dev
          - qa
          - stage
          - prod

jobs:

  tagify:
    name: Get Tag
    if: ${{ contains(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    outputs:
      the_tag: ${{ steps.latest_tag.outputs.TAG_NAME }}
      version_number: ${{ steps.version.outputs.VERSION_NUMBER }}
    steps:
      - name: Get Tag
        id: latest_tag
        run: |
          echo "TAG_NAME=${GITHUB_REF#refs/*/}" >> $GITHUB_OUTPUT
      - name: Extract Version Number
        id: version
        run: |
          VERSION=$(echo "${GITHUB_REF#refs/tags/v}" | sed 's/-.*//')
          echo "VERSION_NUMBER=$VERSION" >> $GITHUB_OUTPUT


  build_and_push:
    needs: [tagify]
    runs-on: ubuntu-latest
    env:
      TAG_VERSION: ${{ needs.tagify.outputs.the_tag }}
      REGISTRY: ${{ secrets.AWS_ECR_REGISTRY }}
      AWS_DEFAULT_REGION: ${{ secrets.AWS_ECR_REGION }}
    steps:
      - uses: actions/checkout@v3
      
      - name: Install Docker Compose
        run: |
          sudo curl -L "https://github.com/docker/compose/releases/latest/download/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
          sudo chmod +x /usr/local/bin/docker-compose
          docker-compose version

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_ECR_REGION }}
         
      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password --region ${{ secrets.AWS_ECR_REGION }} | \
          docker login --username AWS --password-stdin ${{ env.REGISTRY }}

      - name: Build and Push Docker Images
        run: |
          docker-compose build
          docker-compose push

  deploy_dev:
    needs: [tagify, build_and_push]
    runs-on: ubuntu-latest
    if: ${{ endsWith(needs.tagify.outputs.the_tag, 'dev-deploy') }}
    env:
      TAG_VERSION: ${{ needs.tagify.outputs.the_tag }}
      REGISTRY: ${{ secrets.AWS_ECR_REGISTRY }}
    steps:
      - name: Set permissions for private key
        run: |
          echo "${{ secrets.EC2_SSH_KEY }}" > KeyPair.pem
          chmod 600 KeyPair.pem
        
      - name: Deploy to Dev Server
        run: |
          ssh -v -o StrictHostKeyChecking=no -i KeyPair.pem ec2-user@${{ secrets.EC2_DEV_IP }} '
            aws ecr get-login-password --region ${{ secrets.AWS_ECR_REGION }} | docker login --username AWS --password-stdin ${{ env.REGISTRY }}
            docker pull ${{env.REGISTRY}}:app-${{env.TAG_VERSION}}
            docker pull ${{env.REGISTRY}}:api-${{env.TAG_VERSION}}
            echo "REGISTRY=${{env.REGISTRY}}"
            echo "TAG_VERSION=${{env.TAG_VERSION}}"     

          # Create the network if it does not exist
          docker network inspect login-portal-networks >/dev/null 2>&1 || docker network create login-portal-networks


          # Stop and remove existing containers if they exist
          docker stop login-portal-api || true
          docker rm login-portal-api || true
          docker stop login-portal-app || true
          docker rm login-portal-app || true
          docker stop sqlserver-container || true
          docker rm sqlserver-container || true

          # Start SQL Server
          docker run -d --name sqlserver-container -p 1433:1433 \
            -e ACCEPT_EULA=Y -e SA_PASSWORD=admin123 \
            --network login-portal-networks \
            mcr.microsoft.com/mssql/server:2019-latest

          # Start Login Portal API
          docker run -d --name login-portal-api -p 8080:8080 \
            --network login-portal-networks \
            -e ASPNETCORE_ENVIRONMENT=Development \
            -e ConnectionStrings__DefaultConnection="Server=sqlserver,1433;Database=user_management_db;User Id=admin;Password=admin123;TrustServerCertificate=True" \
            ${{ env.REGISTRY }}:api-${{ env.TAG_VERSION }}

          # Start Login Portal App
          docker run -d --name login-portal-app -p 8081:8080 \
            --network login-portal-networks \
          -e ASPNETCORE_ENVIRONMENT=Development \
          -e API_URL="http://loginportal:8080" \
          -e ConnectionStrings__DefaultConnection="Server=sqlserver,1433;Database=user_management_db;User Id=admin;Password=admin123;TrustServerCertificate=True" \
          ${{ env.REGISTRY }}:app-${{ env.TAG_VERSION }}
          '

  deploy_qa:
    needs: [tagify, build_and_push]
    runs-on: ubuntu-latest
    if: ${{ endsWith(needs.tagify.outputs.the_tag, 'qa-deploy') }}
    env:
      TAG_VERSION: ${{ needs.tagify.outputs.the_tag }}
      REGISTRY: ${{ secrets.AWS_ECR_REGISTRY }}
    steps:
      - name: Set permissions for private key
        run: |
          echo "${{ secrets.EC2_SSH_KEY }}" > KeyPair.pem
          chmod 600 KeyPair.pem
          
      - name: Deploy to QA Server
        run: |
          ssh -v -o StrictHostKeyChecking=no -i KeyPair.pem ec2-user@${{ secrets.EC2_QA_IP }} '
            aws ecr get-login-password --region ${{ secrets.AWS_ECR_REGION }} | docker login --username AWS --password-stdin ${{ env.REGISTRY }}
            docker pull ${{env.REGISTRY}}:app-${{env.TAG_VERSION}}
            docker pull ${{env.REGISTRY}}:api-${{env.TAG_VERSION}}
            echo "REGISTRY=${{env.REGISTRY}}"
            echo "TAG_VERSION=${{env.TAG_VERSION}}"     

          # Create the network if it does not exist
          docker network inspect login-portal-networks >/dev/null 2>&1 || docker network create login-portal-networks


          # Stop and remove existing containers if they exist
          docker stop login-portal-api || true
          docker rm login-portal-api || true
          docker stop login-portal-app || true
          docker rm login-portal-app || true
          docker stop sqlserver-container || true
          docker rm sqlserver-container || true

          # Start SQL Server
          docker run -d --name sqlserver-container -p 1433:1433 \
            -e ACCEPT_EULA=Y -e SA_PASSWORD=admin123 \
            --network login-portal-networks \
            mcr.microsoft.com/mssql/server:2019-latest

          # Start Login Portal API
          docker run -d --name login-portal-api -p 8080:8080 \
            --network login-portal-networks \
            -e ASPNETCORE_ENVIRONMENT=Development \
            -e ConnectionStrings__DefaultConnection="Server=sqlserver,1433;Database=user_management_db;User Id=admin;Password=admin123;TrustServerCertificate=True" \
            ${{ env.REGISTRY }}:api-${{ env.TAG_VERSION }}

          # Start Login Portal App
          docker run -d --name login-portal-app -p 8081:8080 \
            --network login-portal-networks \
          -e ASPNETCORE_ENVIRONMENT=Development \
          -e API_URL="http://loginportal:8080" \
          -e ConnectionStrings__DefaultConnection="Server=sqlserver,1433;Database=user_management_db;User Id=admin;Password=admin123;TrustServerCertificate=True" \
          ${{ env.REGISTRY }}:app-${{ env.TAG_VERSION }}
          '


  deploy_stage:
    needs: [tagify, build_and_push]
    runs-on: ubuntu-latest
    if: ${{ endsWith(needs.tagify.outputs.the_tag, 'stage-deploy') }}
    env:
      TAG_VERSION: ${{ needs.tagify.outputs.the_tag }}
      REGISTRY: ${{ secrets.AWS_ECR_REGISTRY }}
    steps:
      - name: Set permissions for private key
        run: |
          echo "${{ secrets.EC2_SSH_KEY }}" > key.pem
          chmod 600 key.pem

      - name: Deploy to Stage Server
        run: |
          ssh -v -o StrictHostKeyChecking=no -i KeyPair.pem ec2-user@${{ secrets.EC2_STAGE_IP }} '
            aws ecr get-login-password --region ${{ secrets.AWS_ECR_REGION }} | docker login --username AWS --password-stdin ${{ env.REGISTRY }}
            docker pull ${{env.REGISTRY}}:app-${{env.TAG_VERSION}}
            docker pull ${{env.REGISTRY}}:api-${{env.TAG_VERSION}}
            echo "REGISTRY=${{env.REGISTRY}}"
            echo "TAG_VERSION=${{env.TAG_VERSION}}"     

          # Create the network if it does not exist
          docker network inspect login-portal-networks >/dev/null 2>&1 || docker network create login-portal-networks


          # Stop and remove existing containers if they exist
          docker stop login-portal-api || true
          docker rm login-portal-api || true
          docker stop login-portal-app || true
          docker rm login-portal-app || true
          docker stop sqlserver-container || true
          docker rm sqlserver-container || true

          # Start SQL Server
          docker run -d --name sqlserver-container -p 1433:1433 \
            -e ACCEPT_EULA=Y -e SA_PASSWORD=admin123 \
            --network login-portal-networks \
            mcr.microsoft.com/mssql/server:2019-latest

          # Start Login Portal API
          docker run -d --name login-portal-api -p 8080:8080 \
            --network login-portal-networks \
            -e ASPNETCORE_ENVIRONMENT=Development \
            -e ConnectionStrings__DefaultConnection="Server=sqlserver,1433;Database=user_management_db;User Id=admin;Password=admin123;TrustServerCertificate=True" \
            ${{ env.REGISTRY }}:api-${{ env.TAG_VERSION }}

          # Start Login Portal App
          docker run -d --name login-portal-app -p 8081:8080 \
            --network login-portal-networks \
          -e ASPNETCORE_ENVIRONMENT=Development \
          -e API_URL="http://loginportal:8080" \
          -e ConnectionStrings__DefaultConnection="Server=sqlserver,1433;Database=user_management_db;User Id=admin;Password=admin123;TrustServerCertificate=True" \
          ${{ env.REGISTRY }}:app-${{ env.TAG_VERSION }}
          '


  deploy_prod:
    needs: [tagify, build_and_push]
    runs-on: ubuntu-latest
    if: ${{ endsWith(needs.tagify.outputs.the_tag, 'prod-deploy') }}
    env:
      TAG_VERSION: ${{ needs.tagify.outputs.the_tag }}
      REGISTRY: ${{ secrets.AWS_ECR_REGISTRY }}
    steps:
      - name: Set permissions for private key
        run: |
          echo "${{ secrets.EC2_SSH_KEY }}" > key.pem
          chmod 600 key.pem

      - name: Deploy to Production Server
        run: |
          ssh -v -o StrictHostKeyChecking=no -i KeyPair.pem ec2-user@${{ secrets.EC2_PROD_IP }} '
            aws ecr get-login-password --region ${{ secrets.AWS_ECR_REGION }} | docker login --username AWS --password-stdin ${{ env.REGISTRY }}
            docker pull ${{env.REGISTRY}}:app-${{env.TAG_VERSION}}
            docker pull ${{env.REGISTRY}}:api-${{env.TAG_VERSION}}
            echo "REGISTRY=${{env.REGISTRY}}"
            echo "TAG_VERSION=${{env.TAG_VERSION}}"     

          # Create the network if it does not exist
          docker network inspect login-portal-networks >/dev/null 2>&1 || docker network create login-portal-networks


          # Stop and remove existing containers if they exist
          docker stop login-portal-api || true
          docker rm login-portal-api || true
          docker stop login-portal-app || true
          docker rm login-portal-app || true
          docker stop sqlserver-container || true
          docker rm sqlserver-container || true

          # Start SQL Server
          docker run -d --name sqlserver-container -p 1433:1433 \
            -e ACCEPT_EULA=Y -e SA_PASSWORD=admin123 \
            --network login-portal-networks \
            mcr.microsoft.com/mssql/server:2019-latest

          # Start Login Portal API
          docker run -d --name login-portal-api -p 8080:8080 \
            --network login-portal-networks \
            -e ASPNETCORE_ENVIRONMENT=Development \
            -e ConnectionStrings__DefaultConnection="Server=sqlserver,1433;Database=user_management_db;User Id=admin;Password=admin123;TrustServerCertificate=True" \
            ${{ env.REGISTRY }}:api-${{ env.TAG_VERSION }}

          # Start Login Portal App
          docker run -d --name login-portal-app -p 8081:8080 \
            --network login-portal-networks \
          -e ASPNETCORE_ENVIRONMENT=Development \
          -e API_URL="http://loginportal:8080" \
          -e ConnectionStrings__DefaultConnection="Server=sqlserver,1433;Database=user_management_db;User Id=admin;Password=admin123;TrustServerCertificate=True" \
          ${{ secrets.AWS_ECR_REGISTRY }}:app-${{ env.TAG_VERSION }}
          '

